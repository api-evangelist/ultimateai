  - type: Authentication
    url: https://developer.zendesk.com/api-reference/ai-agents/authentication/
- name: Ultimate.ai Public API (legacy, retired)
  description: >-
    The original Ultimate.ai Public API on chat.ultimate.ai - Chat Automation
    (POST /api/v2/automation), Intent Recognition (POST /api/intents), and Delete User
    Data (POST /api/gdpr/delete-user-data) - documented in a Slate docs repo in the
    ultimateai GitHub org. Probed 2026-07-21: endpoints return 404; superseded by the
    Zendesk AI Agents API.
  humanURL: https://github.com/ultimateai/public-api
  baseURL: https://chat.ultimate.ai
  x-status: retired
