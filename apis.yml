aid: ultimateai
name: Ultimate.ai
description: >-
  Ultimate.ai was a Helsinki- and Berlin-based customer support automation platform -
  virtual agents and chatbots with intent recognition and agent-assist - backed by HV
  Capital and Techstars. Zendesk acquired Ultimate.ai in 2024 and the product now ships
  as Zendesk AI agents (the "AI agents - Advanced" add-on); ultimate.ai redirects to
  zendesk.com and the successor AI Agents APIs (Chat, Ticket, Widget Escalation, Data
  Export, Delete User Data plus webhooks) are documented on developer.zendesk.com, with
  API keys still generated from the Ultimate.ai dashboard. The legacy Ultimate.ai Public
  API on chat.ultimate.ai is retired.
