apis:
- name: Zendesk AI Agents API (formerly Ultimate.ai)
  description: >-
    Successor API surface of the Ultimate.ai platform after the Zendesk acquisition -
    Chat, Ticket, and Widget Escalation APIs with matching webhooks, plus Data Export and
    Delete User Data. Requires the AI agents - Advanced add-on; authenticates with a
    Custom CRM or organization API key generated from the Ultimate.ai dashboard.
  humanURL: https://developer.zendesk.com/api-reference/ai-agents/introduction/
  baseURL: https://{subdomain}.zendesk.com/ai-agents/api
  tags:
